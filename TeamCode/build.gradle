apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        // '=' assignment required: Gradle 9 removed space-assignment for
        // Gradle-generated properties (this one was flagged in the problems report).
        jniLibs.useLegacyPackaging = true
    }
}

// Keep the Kotlin bytecode target aligned with the Java 8 target set in
// build.common.gradle. A mismatch is a hard build failure
// ("Inconsistent JVM-target compatibility"), not a warning.
// Uses the modern compilerOptions DSL; the old `kotlinOptions` block is deprecated.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

//TunerTeleOp, Turret + Drivetrain Autotuner, Shooter HyperTuning and every OpMode's recording (RobotLog): whenever a robot is on adb, new runs get pulled into tuning-data before the build,
//then :Sim:analyzeTuning turns them into Constants/TunedConstants.java
def tuningSdkDir = android.sdkDirectory

tasks.register('pullTuningData') {
    group = 'tuning'
    def sets = [
            [remote: '/sdcard/FIRST/data/TunerTeleOp', file: 'loop.csv', pattern: /\/TunerTeleOp\/(\d{8}-\d{6})\/loop\.csv (\d+)/, local: rootProject.file('tuning-data/sessions')],
            [remote: '/sdcard/FIRST/data/TurretAutotune', file: 'result.csv', pattern: /\/TurretAutotune\/(\d{8}-\d{6}-[a-z]+)\/result\.csv (\d+)/, local: rootProject.file('tuning-data/turret-autotune')],
            [remote: '/sdcard/FIRST/data/DriveAutotune', file: 'result.csv', pattern: /\/DriveAutotune\/(\d{8}-\d{6})\/result\.csv (\d+)/, local: rootProject.file('tuning-data/drive-autotune')],
            [remote: '/sdcard/FIRST/data/ShooterHyperTuning', file: 'gains.csv', pattern: /\/ShooterHyperTuning\/(\d{8}-\d{6})\/gains\.csv (\d+)/, local: rootProject.file('tuning-data/hypertuning')],
            [remote: '/sdcard/FIRST/data/RobotLog', file: 'frames.bin', pattern: /\/RobotLog\/(\d{8}-\d{6}-[A-Za-z0-9]+)\/frames\.bin (\d+)/, local: rootProject.file('tuning-data/robot-logs')]
    ]
    doLast {
        def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
        def adb = new File(tuningSdkDir, 'platform-tools/adb' + (isWindows ? '.exe' : ''))
        def run = { List<String> cmd, long seconds ->
            def outFile = File.createTempFile('adb', '.txt')
            def p = new ProcessBuilder(cmd.collect { it.toString() } as List<String>).redirectErrorStream(true).redirectOutput(outFile).start() //GStrings break ProcessBuilder
            def done = p.waitFor(seconds, java.util.concurrent.TimeUnit.SECONDS)
            if (!done) p.destroyForcibly()
            def text = outFile.text
            outFile.delete()
            return done && p.exitValue() == 0 ? text : null
        }
        if (project.findProperty('skipTuningPull') == 'true') {
            logger.lifecycle('tuning: skipTuningPull=true, not touching adb')
            return
        }
        if (!adb.isFile()) {
            logger.lifecycle('tuning: no adb, not pulling')
            return
        }
        def devices = run([adb.path, 'devices'], 10)
        def serial = devices?.readLines()?.findAll { it.endsWith('\tdevice') }?.collect { it.split('\t')[0] }?.find()
        if (serial == null) {
            logger.lifecycle('tuning: no robot on adb, not pulling')
            return
        }
        sets.each { set -> try {
            def listing = run([adb.path, '-s', serial, 'shell', "stat -c '%n %s' ${set.remote}/*/${set.file} 2>/dev/null"], 20)
            if (listing == null) {
                logger.lifecycle("tuning: nothing in ${set.remote}")
                return
            }
            set.local.mkdirs()
            int pulled = 0
            listing.readLines().each { line ->
                def m = line.trim() =~ set.pattern
                if (!m.find()) return
                def name = m.group(1)
                long remoteSize = m.group(2) as long
                def local = new File(set.local, "${name}/${set.file}")
                if (local.isFile() && local.length() == remoteSize) return
                if (run([adb.path, '-s', serial, 'pull', "${set.remote}/${name}", set.local.path], 120) != null) pulled++
                else logger.warn("tuning: couldn't pull ${name}")
            }
            logger.lifecycle("tuning: pulled ${pulled} new from ${set.remote} on ${serial}")
        } catch (Exception e) {
            logger.warn("tuning: couldn't pull from ${set.remote} (${e.message}), building anyway")
        } }
    }
}

tasks.named('preBuild') {
    dependsOn(':Sim:analyzeTuning')
}
