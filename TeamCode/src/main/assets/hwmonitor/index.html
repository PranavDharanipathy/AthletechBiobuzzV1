<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardware Monitor</title>
<!--
  HardwareMonitor dashboard. Served by the Robot Controller at /hwmonitor (see
  Utility/Monitoring/MonitorWebServer.java). Also works opened straight from disk: use
  "Open folder" on a copy made with  adb pull /sdcard/FIRST/data/HardwareMonitor
  Self-contained on purpose: a laptop on the robot's Wi-Fi has no internet, so no CDNs.
-->
<style>
:root {
  --bg: #f3f5f8; --panel: #ffffff; --panel2: #f8f9fb; --text: #1a2030; --muted: #657085;
  --border: #e1e5ec; --grid: #edf0f4; --axis: #8a93a5;
  --accent: #2f6fed; --accent-weak: #e7eefe; --good: #15803d; --warn: #b45309; --bad: #dc2626;
  --good-bg: #e8f6ee; --warn-bg: #fdf3e2; --bad-bg: #fdecec; --info-bg: #eaf1fe;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1016; --panel: #141a22; --panel2: #19202a; --text: #e5eaf1; --muted: #8b95a7;
    --border: #252e3a; --grid: #1f2732; --axis: #6f7a8c;
    --accent: #5b8dff; --accent-weak: #1a2846; --good: #3fb950; --warn: #e3a008; --bad: #f85149;
    --good-bg: #13291c; --warn-bg: #2d230e; --bad-bg: #331617; --info-bg: #15233d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1016; --panel: #141a22; --panel2: #19202a; --text: #e5eaf1; --muted: #8b95a7;
  --border: #252e3a; --grid: #1f2732; --axis: #6f7a8c;
  --accent: #5b8dff; --accent-weak: #1a2846; --good: #3fb950; --warn: #e3a008; --bad: #f85149;
  --good-bg: #13291c; --warn-bg: #2d230e; --bad-bg: #331617; --info-bg: #15233d;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }

header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.brand span { color: var(--accent); }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--panel2);
  border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--panel); cursor: pointer; white-space: nowrap;
  text-decoration: none; color: var(--text); font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.small { padding: 2px 8px; font-size: 12px; }

#layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100% - 53px); }
aside { border-right: 1px solid var(--border); background: var(--panel); padding: 12px 10px;
  position: sticky; top: 53px; height: calc(100vh - 53px); overflow: auto; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px;
  font-weight: 600; }
.sess { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; padding: 8px 8px; border-radius: 8px;
  cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
.sess:hover { background: var(--panel2); }
.sess.active { background: var(--accent-weak); border-color: var(--accent); }
.sess input { margin: 3px 0 0; }
.sess .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .meta { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 99px;
  vertical-align: 1px; }
.badge.live { background: var(--bad); color: #fff; animation: pulse 1.6s infinite; }
.badge.inc { background: var(--warn-bg); color: var(--warn); }
@keyframes pulse { 50% { opacity: .55; } }

main { padding: 16px 20px 40px; min-width: 0; }
.empty { max-width: 720px; margin: 40px auto; background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 22px 26px; box-shadow: var(--shadow); }
.empty h2 { margin-top: 0; }
.empty code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }

.sess-header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
.sess-header h1 { font-size: 20px; margin: 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tab { padding: 8px 14px; border: 0; background: none; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 14px; }
.panel h3 { margin: 0 0 8px; font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
.kpi .label { font-size: 12px; color: var(--muted); }
.kpi .value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .value small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.finding { padding: 7px 10px 7px 12px; border-radius: 8px; border-left: 4px solid; font-size: 13px; }
.finding.good { background: var(--good-bg); border-color: var(--good); }
.finding.info { background: var(--info-bg); border-color: var(--accent); }
.finding.warn { background: var(--warn-bg); border-color: var(--warn); }
.finding.bad { background: var(--bad-bg); border-color: var(--bad); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 14px; align-items: start; }
.chart { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 6px;
  box-shadow: var(--shadow); min-width: 0; }
.chart-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
.chart-title { font-weight: 600; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.legend span { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 5px; }
.legend span.off { opacity: .4; text-decoration: line-through; }
.legend i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.chart-canvas { position: relative; }
.chart-canvas canvas { display: block; width: 100%; cursor: crosshair; }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--panel); border: 1px solid var(--border);
  border-radius: 7px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); z-index: 5;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip b { font-weight: 600; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.kpi.good { border-left: 4px solid var(--good); }
.kpi.warn { border-left: 4px solid var(--warn); }
.kpi.bad { border-left: 4px solid var(--bad); }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 99px;
  border: 1px solid var(--border); background: var(--panel); cursor: pointer; user-select: none; }
.chip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
.chip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
.controls label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.chk { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 8px;
  border: 1px solid var(--border); border-radius: 99px; cursor: pointer; background: var(--panel); }
select, input[type=search], input[type=text] { background: var(--panel); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 8px; }

.dt-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 8px; }
table.dt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.dt th, table.dt td { padding: 4px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.dt thead th { position: sticky; top: 0; background: var(--panel2); text-align: left; cursor: pointer;
  user-select: none; z-index: 2; font-weight: 600; }
table.dt thead th.num, table.dt td.num { text-align: right; }
table.dt thead th:hover { color: var(--accent); }
table.dt tbody tr:hover td { background: var(--accent-weak); }
table.dt tfoot td { position: sticky; background: var(--panel2); font-size: 11.5px; color: var(--muted); }
table.dt tfoot tr:nth-child(1) td { bottom: 46px; }
table.dt tfoot tr:nth-child(2) td { bottom: 23px; }
table.dt tfoot tr:nth-child(3) td { bottom: 0; }
table.dt td.rowlabel { color: var(--muted); }
.dt-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.tables-layout { display: grid; grid-template-columns: 200px 1fr; gap: 14px; }
.ds-list { display: flex; flex-direction: column; gap: 2px; }
.ds-list button { text-align: left; padding: 6px 10px; border-radius: 7px; border: 1px solid transparent;
  background: none; cursor: pointer; font-size: 13px; }
.ds-list button:hover { background: var(--panel2); }
.ds-list button.active { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ds-list .group { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 8px 10px 2px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
#drop { position: fixed; inset: 0; background: rgba(47, 111, 237, .14); border: 3px dashed var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; z-index: 50; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; }
@media (max-width: 900px) {
  #layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); }
  .grid2 { grid-template-columns: 1fr; }
  .tables-layout { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Hardware <span>Monitor</span></div>
  <div id="source" class="pill">connecting…</div>
  <div class="spacer"></div>
  <button id="btnRefresh" class="btn" title="Reload the session list">Refresh</button>
  <label class="btn" title="Browse a HardwareMonitor folder copied off the robot">Open folder…
    <input id="folderInput" type="file" webkitdirectory multiple hidden></label>
  <label class="btn" title="Open individual session files">Open files…
    <input id="filesInput" type="file" multiple accept=".csv,.json" hidden></label>
  <button id="btnClear" class="btn danger" hidden>Clear database</button>
  <button id="btnTheme" class="btn" title="Switch light / dark" aria-label="Switch light / dark"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
</header>
<div id="layout">
  <aside>
    <div class="side-head"><span>Sessions <span id="sessCount" class="muted"></span></span>
      <span class="muted" style="font-size:12px;font-weight:400" title="Tick sessions to compare them">☑ compare</span></div>
    <div id="sessList"></div>
    <div id="dbInfo" class="muted" style="font-size:12px;padding:8px 4px"></div>
  </aside>
  <main>
    <div id="emptyView" class="empty" hidden></div>
    <div id="sessionView" hidden>
      <div id="sessHeader" class="sess-header"></div>
      <nav id="tabs" class="tabs"></nav>
      <section id="tabBody"></section>
    </div>
  </main>
</div>
<div id="drop" hidden>Drop a HardwareMonitor folder or session files</div>
<div id="toast" hidden></div>
<script>
'use strict';
/* =====================================================================================
 *  Basics
 * ===================================================================================== */
const API = '/hwmonitor/api/';
const SESSION_FILES = ['summary.json', 'system.csv', 'motors.csv', 'devices.csv', 'events.csv'];
const PALETTE = ['#4e79a7', '#f28e2b', '#e15759', '#59a14f', '#b07aa1', '#edc948', '#76b7b2', '#ff9da7', '#9c755f', '#79706e'];
const color = i => PALETTE[i % PALETTE.length];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $ = (s, el = document) => el.querySelector(s);
const ok = v => v != null && Number.isFinite(Number(v)) && v !== '';
const fmt = (v, d = 2) => ok(v) ? Number(v).toFixed(d) : '–';
const fmtInt = v => ok(v) ? Math.round(v).toLocaleString() : '–';
function fmtBytes(b) {
  if (!ok(b)) return '–';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function fmtDur(s) {
  if (!ok(s)) return '–';
  if (s < 60) return s.toFixed(1) + ' s';
  const m = Math.floor(s / 60);
  return m + 'm ' + String(Math.round(s - m * 60)).padStart(2, '0') + 's';
}
/** Compact number for tables and tooltips. */
function smart(v) {
  if (!ok(v)) return v == null ? '' : String(v);
  v = Number(v);
  if (Number.isInteger(v) && Math.abs(v) < 1e12) return String(v);
  const a = Math.abs(v);
  const d = a >= 1000 ? 1 : a >= 100 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 4 : 6;
  return v.toFixed(d);
}
function toast(msg, ms = 3000) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms);
}
function download(name, text, type = 'text/csv') {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
}
const get = (o, path, d) => path.split('.').reduce((x, k) => (x == null ? undefined : x[k]), o) ?? d;

/* =====================================================================================
 *  Data sources: the robot's web API, or files from the user's disk
 * ===================================================================================== */
class RobotSource {
  constructor() { this.kind = 'robot'; this.label = 'Robot · ' + location.host; }
  async listSessions() {
    const r = await fetch(API + 'sessions', { cache: 'no-store' });
    if (!r.ok) throw new Error('sessions: HTTP ' + r.status);
    return r.json();
  }
  async file(id, name, offset = 0) {
    const r = await fetch(`${API}file?session=${encodeURIComponent(id)}&name=${name}&offset=${offset}`, { cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
    const next = Number(r.headers.get('X-Next-Offset'));
    return { text: await r.text(), next: Number.isFinite(next) ? next : null };
  }
  async live() {
    const r = await fetch(API + 'live', { cache: 'no-store' });
    if (r.status === 204) return null;
    if (!r.ok) throw new Error('live: HTTP ' + r.status);
    return r.json();
  }
  downloadHref(id, name) { return `${API}file?session=${encodeURIComponent(id)}&name=${name}&download=1`; }
  async remove(id) {
    const r = await fetch(`${API}delete?session=${encodeURIComponent(id)}`, { method: 'POST' });
    if (!r.ok) throw new Error(await r.text());
  }
  async clear() {
    const r = await fetch(API + 'clear', { method: 'POST' });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
}

class LocalSource {
  /** @param files Map(sessionId -> Map(fileName -> File)) */
  constructor(files) { this.kind = 'local'; this.label = 'Local files'; this.files = files; }
  async listSessions() {
    const sessions = [];
    let total = 0;
    for (const [id, m] of this.files) {
      const info = { id, opMode: id, start: '', files: {}, sizeBytes: 0, complete: false, recording: false };
      for (const [n, f] of m) { info.files[n] = f.size; info.sizeBytes += f.size; }
      total += info.sizeBytes;
      if (m.has('summary.json')) {
        try { Object.assign(info, sessionInfoFromSummary(JSON.parse(await m.get('summary.json').text()))); } catch (e) { /* unreadable */ }
      }
      sessions.push(info);
    }
    sessions.sort((a, b) => String(b.id).localeCompare(String(a.id)));
    return { recording: null, sessions, path: 'files on this computer', totalBytes: total };
  }
  async file(id, name, offset = 0) {
    const f = this.files.get(id) && this.files.get(id).get(name);
    if (!f) return null;
    const text = await f.text();
    return { text: offset ? text.slice(offset) : text, next: f.size };
  }
  async live() { return null; }
  downloadHref(id, name) {
    const f = this.files.get(id) && this.files.get(id).get(name);
    return f ? URL.createObjectURL(f) : '#';
  }
}

function sessionInfoFromSummary(s) {
  const se = s.session || {}, lp = s.loop || {}, pw = s.power || {};
  return {
    opMode: se.opMode, start: se.start, durationS: se.durationS, loops: lp.count, avgLoopMs: lp.avgMs,
    p95LoopMs: lp.p95Ms, minBatteryV: get(pw, 'batteryV.min'), energyWh: pw.energyWh,
    devices: (s.devices || []).length, complete: !!se.complete,
  };
}

/** Groups loose files into sessions by their parent folder name. */
function addLocalFile(map, path, file) {
  const parts = path.split(/[\\/]/).filter(Boolean);
  const name = parts[parts.length - 1];
  if (!SESSION_FILES.includes(name)) return;
  const id = parts.length >= 2 ? parts[parts.length - 2] : 'opened-files';
  if (!map.has(id)) map.set(id, new Map());
  map.get(id).set(name, file);
}
async function entriesToFiles(entry, path, out) {
  if (entry.isFile) {
    const f = await new Promise((res, rej) => entry.file(res, rej));
    out.push([path + entry.name, f]);
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const e of batch) await entriesToFiles(e, path + entry.name + '/', out);
    }
  }
}

/* =====================================================================================
 *  CSV
 * ===================================================================================== */
class Table {
  constructor(header) { this.header = header || []; this.rows = []; this.index = new Map(this.header.map((c, i) => [c, i])); this.cache = new Map(); }
  get length() { return this.rows.length; }
  has(c) { return this.index.has(c); }
  num(c) {
    if (this.cache.has(c)) return this.cache.get(c);
    const i = this.index.get(c), out = new Float64Array(this.rows.length);
    for (let r = 0; r < this.rows.length; r++) {
      const s = i == null ? '' : this.rows[r][i];
      out[r] = s === '' || s == null ? NaN : +s;
    }
    this.cache.set(c, out);
    return out;
  }
  str(c) { const i = this.index.get(c); return this.rows.map(r => r[i]); }
  append(rows) { for (const r of rows) this.rows.push(r); this.cache.clear(); }
}
/** Incremental CSV reader: feed text chunks (e.g. live appends); keeps a partial last line. */
class CsvStream {
  constructor() { this.table = null; this.pending = ''; this.offset = 0; }
  feed(text) {
    const all = this.pending + text;
    const cut = all.lastIndexOf('\n');
    if (cut < 0) { this.pending = all; return; }
    this.pending = all.slice(cut + 1);
    const rows = [];
    for (let line of all.slice(0, cut).split('\n')) {
      if (line.endsWith('\r')) line = line.slice(0, -1);

/* =====================================================================================
 *  Overview
 * ===================================================================================== */
function findings(sess) {
  const s = sess.summary || {}, se = s.session || {}, lp = s.loop || {}, pw = s.power || {}, mon = s.monitor || {};
  const out = [], add = (level, text) => out.push({ level, text });
  if (!sess.live && se.complete === false) add('warn', 'This session was not closed cleanly (power loss, app restart or a crash). Data is complete up to the last save.');
  if (ok(lp.p95Ms)) {
    if (lp.p95Ms > 30) add('bad', `Slow loop: 95% of loops take up to ${fmt(lp.p95Ms, 1)} ms (${fmt(1000 / lp.p95Ms, 0)} Hz). Control code gets sluggish below ~50 Hz.`);
    else if (lp.p95Ms > 15) add('warn', `Loop p95 is ${fmt(lp.p95Ms, 1)} ms (${fmt(1000 / lp.p95Ms, 0)} Hz) – fine, with room to speed up.`);
    else add('good', `Fast loop: p95 ${fmt(lp.p95Ms, 1)} ms, ${fmt(lp.avgHz, 0)} Hz on average.`);
  }
  if (ok(lp.p50Ms) && ok(lp.maxMs) && lp.maxMs > 4 * lp.p50Ms && lp.maxMs > 20) {
    add('info', `Loop spikes: the slowest loop took ${fmt(lp.maxMs, 1)} ms, ${fmt(lp.maxMs / lp.p50Ms, 0)}× the median${ok(lp.p99Ms) ? ` (p99 ${fmt(lp.p99Ms, 1)} ms)` : ''}. Look for sleeps, blocking reads or telemetry bursts at those times in Timeline.`);
  }
  if (ok(lp.hwPctOfLoop) && lp.hwPctOfLoop > 60) add('warn', `Hardware calls take ${fmt(lp.hwPctOfLoop, 0)}% of each loop (${fmt(lp.hwMsPerLoop, 1)} ms). Fewer reads, read caching or bulk caching will speed the loop up the most.`);
  const hubs = s.hubs || [];
  const off = hubs.filter(x => x.bulkCachingMode === 'OFF');
  if (off.length) add('warn', `Bulk caching is OFF on ${off.map(x => x.name).join(', ')}. AUTO or MANUAL turns many motor and encoder reads into one hub transaction.`);
  for (const x of hubs) {
    if (x.notRespondingSamples > 0) add('bad', `${x.name} stopped responding ${x.notRespondingSamples} time(s) – check its cable and for static discharge.`);
    const tc = get(x, 'tempC.max');
    if (ok(tc) && tc > 60) add('warn', `${x.name} reached ${fmt(tc, 0)} °C.`);
  }
  const bat = pw.batteryV || {};
  if (pw.lowVoltageEvents > 0) add('bad', `Battery dropped below ${fmt(pw.lowVoltageThresholdV, 1)} V ${pw.lowVoltageEvents} time(s) (min ${fmt(bat.min, 2)} V) – brown-out risk.`);
  else if (ok(bat.min) && bat.min < 11.5) add('warn', `Battery sagged to ${fmt(bat.min, 2)} V under load. Charge or swap it before a match.`);
  else if (ok(bat.min)) add('good', `Battery stayed at or above ${fmt(bat.min, 2)} V.`);
  for (const m of s.motors || []) {
    const mx = get(m, 'currentA.max');
    if (ok(mx) && mx > 8) add('warn', `${m.name} drew up to ${fmt(mx, 1)} A – stalled or binding? Sustained high current heats the motor and can trip over-current protection.`);
    const r = get(m, 'bemfToBattery.max');
    if (ok(r) && r > 0.95) add('info', `${m.name} reached ${fmt(r * 100, 0)}% of the battery voltage as back-EMF – it was at full speed for this battery.`);
  }
  const devs = s.devices || [];
  for (const d of devs) {
    if (!d.cacheReads) for (const o of d.ops || []) {
      if (o.kind === 'R' && lp.count > 0 && o.count / lp.count > 1.5) add('info', `${d.name}.${o.op}() is read ${fmt(o.count / lp.count, 1)}× per loop with read caching off. Pass true for cacheReads to hit the hardware once per loop.`);
    }
    if (d.writes >= 50 && d.redundantWrites / d.writes > 0.5) add('info', `${d.name}: ${fmt(100 * d.redundantWrites / d.writes, 0)}% of writes repeated the value it already had.`);
  }
  devs.filter(d => d.hardwareReads > 0 && d.avgReadLatencyUs > 1500).sort((a, b) => b.avgReadLatencyUs - a.avgReadLatencyUs).slice(0, 3)
    .forEach(d => add('info', `${d.name} reads take ${fmt(d.avgReadLatencyUs / 1000, 2)} ms each on average (${fmtInt(d.hardwareReads)} hardware reads)${d.cacheReads ? '.' : ' – read it once per loop or enable caching.'}`));
  const top = devs.slice().sort((a, b) => (b.totalIoMs || 0) - (a.totalIoMs || 0))[0];
  if (top && top.totalIoMs > 0 && lp.count > 0) add('info', `Biggest hardware cost: ${top.name}, ${fmt(top.ioSharePct, 0)}% of all hardware time (${fmt(top.totalIoMs / lp.count, 2)} ms per loop).`);
  if (mon.eventLogLimitReached) add('info', 'events.csv reached its size limit, so later individual events were not logged (counts and statistics are still complete).');
  if (mon.eventsDropped > 0) add('info', `${fmtInt(mon.eventsDropped)} events were dropped because the logger fell behind.`);
  if (mon.sampleErrors > 0) add('info', `${fmtInt(mon.sampleErrors)} monitor sample reads failed.`);
  if (se.lifecycleHook === false) add('info', 'The OpMode lifecycle hook was not active, so this session relied on start()/stop() calls.');
  return out;
}
function viewOverview(sess) {

        !ok(bat.min) ? '' : bat.min < 10 || pw.lowVoltageEvents > 0 ? 'bad' : bat.min < 11.5 ? 'warn' : 'good'),
      kpi('Current', fmt(cur.avg, 2), 'A avg', `peak ${fmt(cur.max, 2)} A · ${fmt(pwr.avg, 0)} W avg · ${fmt(pwr.max, 0)} W peak`),
      kpi('Energy used', fmt(pw.energyWh, 3), 'Wh', `${fmt(pw.chargeMah, 0)} mAh of battery charge`),
      kpi('Monitor overhead', fmt(mon.overheadMsPerLoop, 3), 'ms/loop', `${fmtInt(mon.sampleReads)} sample reads · ${fmtInt(mon.eventsLogged)} events logged`),
      kpi('Robot Controller', fmt(get(jvm, 'cpuPctOfOneCore.avg'), 0), '% CPU', `heap up to ${fmt(get(jvm, 'heapUsedMb.max'), 0)} of ${fmt(jvm.heapMaxMb, 0)} MB`));
    const f = findings(sess);
    list.replaceChildren(...(f.length ? f : [{ level: 'info', text: 'Nothing to report yet.' }]).map(x => h('li', { class: 'finding ' + x.level }, x.text)));
    const t = sysT(sess), ts = t.num('t_s');
    const initS = get(s, 'session.initS');
    loopC.o.vlines = batC.o.vlines = ok(initS) && initS > 0 ? [{ x: initS, label: 'start' }] : [];
    loopC.hlines = ok(lp.p95Ms) ? [{ y: lp.p95Ms, label: 'p95', color: cssVar('--warn') }] : [];
    loopC.setSeries([ser(ts, t.num('loop_ms'), 'loop', 0), ser(ts, t.num('loop_avg_ms'), 'average', 1, { width: 2.2 })]);
    batC.hlines = ok(pw.lowVoltageThresholdV) && ok(bat.min) && bat.min < pw.lowVoltageThresholdV + 1.5 ? [{ y: pw.lowVoltageThresholdV, label: 'low-voltage threshold' }] : [];

function viewTimeline(sess) {

  show(S.tableDs);
  return {
    el: h('div', { class: 'tables-layout' }, h('div', { class: 'panel', style: { padding: '8px' } }, listEl), h('div', { class: 'panel' }, main)),
    update: () => { if (table && current && current.ds) table.setDataset(current.ds(sess)); },
  };
}

/* =====================================================================================
 *  Compare sessions
 * ===================================================================================== */
async function sessionData(id) {
  if (S.sess && S.sess.id === id && !S.sess.live) return { summary: S.sess.summary, system: sysT(S.sess) };
  if (S.cache.has(id)) return S.cache.get(id);
  const [sum, sys] = await Promise.all([S.src.file(id, 'summary.json'), S.src.file(id, 'system.csv')]);
  let summary = {};
  try { summary = sum ? JSON.parse(sum.text) : {}; } catch (e) { /* damaged */ }
  const d = { summary, system: sys ? parseCsv(sys.text) : new Table([]) };
  S.cache.set(id, d);
  return d;
}
const COMPARE_METRICS = [
  ['Duration', 's', 'session.durationS'], ['Loops', '', 'loop.count'], ['Loop time avg', 'ms', 'loop.avgMs', -1], ['Loop time p50', 'ms', 'loop.p50Ms', -1],
  ['Loop time p95', 'ms', 'loop.p95Ms', -1], ['Loop time p99', 'ms', 'loop.p99Ms', -1], ['Loop time max', 'ms', 'loop.maxMs', -1], ['Loop rate', 'Hz', 'loop.avgHz', 1],
  ['Hardware time per loop', 'ms', 'loop.hwMsPerLoop', -1], ['Hardware share of loop', '%', 'loop.hwPctOfLoop', -1], ['Reads per loop', '', 'loop.readsPerLoop', -1],
  ['Writes per loop', '', 'loop.writesPerLoop', -1], ['Cache hits per loop', '', 'loop.cacheHitsPerLoop'], ['Battery min', 'V', 'power.batteryV.min', 1],
  ['Battery avg', 'V', 'power.batteryV.avg'], ['Current avg', 'A', 'power.totalCurrentA.avg'], ['Current max', 'A', 'power.totalCurrentA.max'],
  ['Power avg', 'W', 'power.totalPowerW.avg'], ['Energy', 'Wh', 'power.energyWh'], ['Charge', 'mAh', 'power.chargeMah'], ['Low-voltage events', '', 'power.lowVoltageEvents', -1],
  ['Devices', '', s => (s.devices || []).length], ['Monitor overhead per loop', 'ms', 'monitor.overheadMsPerLoop', -1], ['App CPU avg', '%', 'jvm.cpuPctOfOneCore.avg', -1],
];
function viewCompare(sess) {
  const box = h('div');
  const ids = [...S.compare];
  if (ids.length < 2) {
    box.append(panel('Compare sessions', h('p', null, 'Tick the box next to two or more sessions in the list on the left to compare loop times, hardware cost, battery and energy side by side.'),
      !S.compare.has(sess.id) ? h('button', { class: 'btn', onclick: () => { S.compare.add(sess.id); renderList(); renderTabs(); renderTab(); } }, 'Add this session') : null));
    return { el: box };
  }
  box.append(panel(null, h('p', { class: 'muted' }, 'Loading ' + ids.length + ' sessions…')));
  (async () => {
    let data;
    try { data = await Promise.all(ids.map(sessionData)); } catch (e) { box.replaceChildren(errorBox(e)); return; }
    if (S.sess !== sess || S.tab !== 'compare') return;
    const infos = ids.map((id, i) => Object.assign({ id }, (S.list.sessions || []).find(s => s.id === id) || {}, { opMode: get(data[i].summary, 'session.opMode') || id, start: get(data[i].summary, 'session.start') || '' }));
    const labels = infos.map(sessLabel);
    const cols = [{ label: 'metric' }, { label: 'unit' }, ...labels.map(l => ({ label: l, num: true })), { label: 'best' }];
    const rows = COMPARE_METRICS.map(([name, unit, path, better]) => {
      const vals = data.map(d => typeof path === 'function' ? path(d.summary) : get(d.summary, path));
      let best = '';
      if (better) {
        const okv = vals.map((v, i) => [v, i]).filter(([v]) => ok(v));
        if (okv.length > 1) { okv.sort((a, b) => (a[0] - b[0]) * -better); if (okv[0][0] !== okv[okv.length - 1][0]) best = labels[okv[0][1]]; }
      }
      return [name, unit, ...vals, best];
    });
    const g = new ChartGroup();
    const loopC = g.add(new LineChart({ title: 'Loop time (rolling average)', unit: 'ms', zeroBased: true, height: 220 }));
    const batC = g.add(new LineChart({ title: 'Battery voltage', unit: 'V', height: 220 }));
    const curC = g.add(new LineChart({ title: 'Total current', unit: 'A', zeroBased: true, height: 220 }));
    const hwC = g.add(new LineChart({ title: 'Hardware time per loop', unit: 'ms', zeroBased: true, height: 220 }));
    const mk = col => data.map((d, i) => ser(d.system.num('t_s'), d.system.num(col), labels[i], i)).filter(Boolean);
    loopC.setSeries(mk('loop_avg_ms')); batC.setSeries(mk('battery_v')); curC.setSeries(mk('total_current_a')); hwC.setSeries(mk('hw_ms_per_loop'));
    const bar = (title, unit, path, dec) => new BarChart({ title, unit, decimals: dec }).setData(data.map((d, i) => ({ label: labels[i], value: get(d.summary, path), color: color(i) })));
    box.replaceChildren(
      h('div', { class: 'grid2' }, bar('Average loop time', 'ms', 'loop.avgMs', 2).el, bar('p95 loop time', 'ms', 'loop.p95Ms', 2).el,
        bar('Hardware time per loop', 'ms', 'loop.hwMsPerLoop', 2).el, bar('Energy used', 'Wh', 'power.energyWh', 3).el),
      h('div', { class: 'section-title' }, 'Side by side'),
      panel(null, new DataTable(arrayDataset(cols, rows), { name: 'compare', pageSize: 100, stats: false }).el),
      h('div', { class: 'section-title' }, 'Over time (x = seconds since each session started)'),
      h('div', { class: 'grid2' }, loopC.el, batC.el, curC.el, hwC.el));
  })();
  return { el: box };
}

const VIEWS = { overview: viewOverview, timeline: viewTimeline, motors: viewMotors, devices: viewDevices, events: viewEvents, tables: viewTables, compare: viewCompare };

/* =====================================================================================
 *  Wiring
 * ===================================================================================== */
function applyTheme(t) {
  try { if (t === undefined) t = localStorage.getItem('hwmonitor.theme'); } catch (e) { t = null; }
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
function wire() {
  $('#btnTheme').onclick = () => {
    const sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const next = (document.documentElement.dataset.theme || sys) === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('hwmonitor.theme', next); } catch (e) { /* private mode */ }
    applyTheme(next);
    if (S.sess) renderTab();
  };
  $('#btnRefresh').onclick = async () => {
    if (!S.src) { location.reload(); return; }
    await refreshList(true);
    if (S.id) { S.cache.delete(S.id); await selectSession(S.id); }
  };
  armConfirm($('#btnClear'), 'Clear database', async () => {
    const r = await S.src.clear();
    toast(`Deleted ${r.deleted} session${r.deleted === 1 ? '' : 's'}` + (S.list.recording ? ' (the recording session was kept)' : ''));
    S.id = null;
    try { history.replaceState(null, '', '#'); } catch (e) { /* ignore */ }
    await useSource(S.src);
  });
  $('#folderInput').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; openLocal(fs.map(f => [f.webkitRelativePath || f.name, f])); };
  $('#filesInput').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; openLocal(fs.map(f => [f.name, f])); };
  let depth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; depth++; $('#drop').hidden = false; e.preventDefault(); });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $('#drop').hidden = true; } });
  window.addEventListener('drop', async e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; $('#drop').hidden = true;
    const items = [...e.dataTransfer.items];
    const entries = items.map(it => it.webkitGetAsEntry ? it.webkitGetAsEntry() : null);
    const loose = items.map(it => it.getAsFile());
    const out = [];
    for (let i = 0; i < items.length; i++) {
      if (entries[i]) await entriesToFiles(entries[i], '', out);
      else if (loose[i]) out.push([loose[i].name, loose[i]]);
    }
    openLocal(out);
  });
}
async function init() {
  applyTheme();
  wire();
  if (/^https?:$/.test(location.protocol)) {
    try { await useSource(new RobotSource()); return; } catch (e) { console.info('HardwareMonitor API not reachable:', e.message); }
  }
  $('#source').textContent = 'no robot connection';
  showEmpty();
}
init();
</script>
