repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://repo.dairy.foundation/releases/' } // Sloth (Pedro tuning runtime)
    maven { url = 'https://maven.anygeneric.dev/' } // BlazeFTC
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // Kotlin standard library. Must match the Kotlin plugin in the root build.gradle
    // (2.4.10) — Sloth, pulled in by pedropathing:tuning, requires stdlib 2.4.10.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'

    // Apache Commons Math — linear algebra, geometry, numerical utilities
    implementation 'org.apache.commons:commons-math3:3.6.1'

    //noinspection NewerVersionAvailable
    implementation 'org.jetbrains:annotations:15.0'

    // Pedro Pathing 3 — com.pedropathing:ftc was retired after 2.1.2; Pedro 3 is
    // revhub (pulls core) + tuning. Do NOT re-add ftc:2.x — it mixes core 2.x/3.x.
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.1'

    // NextFTC v2 command framework, built on Pedro's Ivy scheduler. Its Sloth version must
    // match the one pedropathing:tuning pulls (0.3.2). Do NOT use dev.nextftc v1 or
    // dev.nextftc.extensions:pedro: v1 clashes with v2 and the extension pulls
    // com.pedropathing:ftc:2.0.0, which mixes core 2.x/3.x.
    implementation 'dev.nextftc.v2:control:0.3.0'
    implementation 'dev.nextftc.v2:hardware:0.3.0'
    implementation 'dev.nextftc.v2:robot:0.3.0'

    // Ivy's Pedro 3 path commands (PedroCommands.follow / hold). The Pedro extension for
    // NextFTC is v1-only, so this is the bridge between the commands and the Follower.
    implementation 'com.pedropathing.ivy:pedro:1.1.1'

    // BlazeFTC: Rust hub-link runtime (background bulk/Pinpoint reads, fast motor writes), run by
    // Utility/Blaze/BlazeSession and NextFTC's BlazeOpMode. Its API must match what NextFTC v2 calls (checked
    // for 0.1.66 vs NextFTC 0.3.0); bump the two together. Not blazeftc_pedro3: its localizer can't relocalize
    // and it writes the drive from Blaze's thread (we have BlazePinpointLocalizer). See DEV_NOTES.
    implementation 'dev.anygeneric:blazeftc:0.1.66'

    // Sloth's FTC Dashboard fork
    implementation('com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0')
}
